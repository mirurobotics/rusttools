name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest # standard GitHub-hosted runners are free in public repos
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Cargo Tools (binstall)
        uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # main

      - name: Install Linters
        run: cargo binstall --force --no-confirm cargo-machete cargo-audit

      - name: Run Linters
        run: LINT_FIX=0 ./scripts/lint.sh

  test:
    # yamllint disable-line rule:line-length
    uses: mirurobotics/workflows/.github/workflows/rust-test.yml@1f850169bfe32a9de0516d5c33360ec202a978e6
    with:
      runs-on: ubuntu-latest # standard GitHub-hosted runners are free in public repos
      lint-imports: cargo run --quiet --

  surface-lint:
    # yamllint disable-line rule:line-length
    uses: mirurobotics/workflows/.github/workflows/surface-lint.yml@aba8fd51d888a53d082843f81d4f788e7d1caae0
    with:
      runs-on: ubuntu-latest # standard GitHub-hosted runners are free in public repos

  coverage-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@21eb0b6228fa6252dafdd9c82e7516ad2328c775 # cargo-llvm-cov
      - run: cargo llvm-cov --text --output-path cov.txt && awk '/src\/app\//{p=1} p' cov.txt | grep -E '^ +[0-9]+\| +0\||\^0|src/app' | head -300
