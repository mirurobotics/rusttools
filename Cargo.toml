[workspace]

[package]
name = "lint-imports"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
toml = "0.8"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
syn = { version = "3", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
static_mut_refs = "deny"

[lints.clippy]
too_many_arguments = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
